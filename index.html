<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>RentDue</title>

    <meta name="description" content="Rent a trading strategy for a fixed term and earn daily returns. Track earnings, complete tasks, earn referral rewards and withdraw via mobile money or USDT." />
    <meta name="keywords" content="RentDue" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#020617" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- iOS never fires beforeinstallprompt and ignores the manifest's display mode
         unless these are present, so an installed iOS build would otherwise open
         with Safari chrome and no standalone status bar. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RentDue" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/api/manifest.json" />
    <link rel="canonical" href="/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="/" />
    <meta property="og:site_name" content="RentDue" />
    <meta property="og:title" content="RentDue" />
    <meta property="og:description" content="Rent a trading strategy for a fixed term and earn daily returns. Track earnings, complete tasks, earn referral rewards and withdraw via mobile money or USDT." />
    <meta property="og:image" content="/social-share.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RentDue" />
    <meta name="twitter:description" content="Rent a trading strategy for a fixed term and earn daily returns. Track earnings, complete tasks, earn referral rewards and withdraw via mobile money or USDT." />
    <meta name="twitter:image" content="/social-share.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "RentDue",
      "description": "Rent a trading strategy for a fixed term and earn daily returns.",
      "inLanguage": "en",
      "publisher": {
        "@type": "Organization",
        "name": "RentDue",
        "logo": {
          "@type": "ImageObject",
          "url": "__LOGO_URL__"
        }
      }
    }
    </script>
    <script>
    // Paint the last-known theme background before React mounts so reloads
    // never flash white. No cache (first visit) = untouched default.
    try {
      var __boot = JSON.parse(localStorage.getItem("rentdue_boot_shell") || "null");
      if (__boot && __boot.bg) {
        document.documentElement.style.background = __boot.bg;
        document.addEventListener("DOMContentLoaded", function () {
          document.body.style.background = __boot.bg;
        });
      }
    } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
  <main style="max-width:40rem;margin:0 auto;padding:2rem 1.25rem;font-family:system-ui,sans-serif;color:#0f172a;line-height:1.6">
    <h1 style="font-size:1.5rem;margin:0 0 0.75rem">RentDue</h1>
    <p style="margin:0 0 1rem">
      Rent a trading strategy for a fixed term and earn daily returns. Track earnings,
      complete tasks, earn referral rewards and withdraw via mobile money or USDT.
    </p>
    <p style="margin:0 0 1.25rem">
      The app needs JavaScript. Enable it to sign in and open your dashboard.
    </p>
    <h2 style="font-size:1.1rem;margin:1.5rem 0 0.5rem">Frequently asked questions</h2>
    <ul style="padding-left:1.1rem;margin:0">
      <li><strong>What am I buying?</strong> A strategy rented for a fixed number of days, with the allocation, daily yield and duration shown before you confirm.</li>
      <li><strong>When do returns show up?</strong> They accrue daily while the cycle runs and land in your balance.</li>
      <li><strong>What happens when a cycle ends?</strong> The cycle closes, the allocation is released back to you, and the strategy stops.</li>
      <li><strong>Can I run more than one cycle?</strong> Yes, as long as each one meets its own minimum allocation.</li>
      <li><strong>How do withdrawals work?</strong> Withdrawals are requested from your balance and reviewed by the team.</li>
    </ul>
  </main>
</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
