<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>RentDue</title>

    <meta name="description" content="Activate trading robots that return fixed returns for a set period of time." />
    <meta name="keywords" content="RentDue" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#020617" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- iOS never fires beforeinstallprompt and ignores the manifest's display mode
         unless these are present, so an installed iOS build would otherwise open
         with Safari chrome and no standalone status bar. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RentDue" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/api/manifest.json" />
    <link rel="canonical" href="/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="/" />
    <meta property="og:site_name" content="RentDue" />
    <meta property="og:title" content="RentDue" />
    <meta property="og:description" content="Activate trading robots that return fixed returns for a set period of time." />
    <meta property="og:image" content="/social-share.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RentDue" />
    <meta name="twitter:description" content="Activate trading robots that return fixed returns for a set period of time." />
    <meta name="twitter:image" content="/social-share.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "RentDue Store",
      "description": "Activate trading robots that return fixed returns for a set period of time..",
      "inLanguage": "en"
    }
    </script>
    <script>
    // Paint the last-known theme background before React mounts so reloads
    // never flash white. No cache (first visit) = untouched default.
    try {
      var __boot = JSON.parse(localStorage.getItem("rentdue_boot_shell") || "null");
      if (__boot && __boot.bg) {
        document.documentElement.style.background = __boot.bg;
        document.addEventListener("DOMContentLoaded", function () {
          document.body.style.background = __boot.bg;
        });
      }
    } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <main style="">

      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
