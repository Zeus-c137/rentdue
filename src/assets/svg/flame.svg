<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 64" width="48" height="64" role="img" aria-label="Dancing flame with sparkles" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sway-outer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9d2e"/>
      <stop offset="1" stop-color="#e5320d"/>
    </linearGradient>
    <linearGradient id="sway-mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd83f"/>
      <stop offset="1" stop-color="#ff9a1f"/>
    </linearGradient>
    <linearGradient id="sway-core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbd6"/>
      <stop offset="1" stop-color="#ffe066"/>
    </linearGradient>
    <radialGradient id="sway-glow">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- pulsing glow -->
  <circle cx="24" cy="42" r="23" fill="url(#sway-glow)">
    <animate attributeName="opacity" values="0.45;1;0.45" dur="1.6s" repeatCount="indefinite"/>
  </circle>

  <!-- sway side to side, anchored at the base -->
  <g>
    <animateTransform attributeName="transform" type="rotate" dur="1.6s" repeatCount="indefinite"
      values="-8 24 60;8 24 60;-8 24 60" keyTimes="0;0.5;1"
      calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>

    <!-- little squish at each end of the swing -->
    <g transform="translate(24 60)">
      <g>
        <animateTransform attributeName="transform" type="scale" dur="0.8s" repeatCount="indefinite"
          values="1.08 0.93;1 1;1.08 0.93" keyTimes="0;0.5;1"
          calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
        <g transform="translate(-24 -60)">

          <path fill="url(#sway-outer)">
            <animate attributeName="d" dur="1.4s" repeatCount="indefinite"
              values="
                M24 2 C26 14 40 22 40 42 C40 53 33 60 24 60 C15 60 8 53 8 42 C8 30 16 26 18 16 C20 22 22 20 24 2 Z;
                M26 4 C24 16 40 24 40 42 C40 53 33 60 24 60 C15 60 8 53 8 42 C8 32 14 26 20 12 C21 20 24 22 26 4 Z;
                M22 3 C28 12 40 20 40 42 C40 53 33 60 24 60 C15 60 8 53 8 42 C8 28 18 28 17 14 C20 20 20 18 22 3 Z;
                M24 2 C26 14 40 22 40 42 C40 53 33 60 24 60 C15 60 8 53 8 42 C8 30 16 26 18 16 C20 22 22 20 24 2 Z"/>
          </path>

          <path fill="url(#sway-mid)">
            <animate attributeName="d" dur="1.1s" repeatCount="indefinite"
              values="
                M24 20 C25 30 34 34 34 46 C34 54 29 60 24 60 C19 60 14 54 14 46 C14 38 20 34 21 28 C22 32 23 30 24 20 Z;
                M25 22 C24 30 34 36 34 46 C34 54 29 60 24 60 C19 60 14 54 14 46 C14 40 19 32 22 26 C23 32 25 30 25 22 Z;
                M23 18 C27 28 34 32 34 46 C34 54 29 60 24 60 C19 60 14 54 14 46 C14 36 21 32 20 26 C22 30 22 28 23 18 Z;
                M24 20 C25 30 34 34 34 46 C34 54 29 60 24 60 C19 60 14 54 14 46 C14 38 20 34 21 28 C22 32 23 30 24 20 Z"/>
          </path>

          <path fill="url(#sway-core)">
            <animate attributeName="d" dur="0.9s" repeatCount="indefinite"
              values="
                M24 38 C25 44 29 46 29 52 C29 57 27 60 24 60 C21 60 19 57 19 52 C19 46 23 44 24 38 Z;
                M24 41 C25 46 29 47 29 52 C29 57 27 60 24 60 C21 60 19 57 19 52 C19 47 23 46 24 41 Z;
                M24 36 C26 43 29 45 29 52 C29 57 27 60 24 60 C21 60 19 57 19 52 C19 45 22 43 24 36 Z;
                M24 38 C25 44 29 46 29 52 C29 57 27 60 24 60 C21 60 19 57 19 52 C19 46 23 44 24 38 Z"/>
          </path>

        </g>
      </g>
    </g>
  </g>

  <!-- twinkling sparkles (start at scale 0 so they stay hidden until their turn) -->
  <g transform="translate(7 18)">
    <path transform="scale(0)" fill="#ffe27a" d="M0 -5 L1.3 -1.3 L5 0 L1.3 1.3 L0 5 L-1.3 1.3 L-5 0 L-1.3 -1.3Z">
      <animateTransform attributeName="transform" type="scale" values="0;1;0" dur="1.6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="0;90" dur="1.6s" repeatCount="indefinite" additive="sum"/>
    </path>
  </g>
  <g transform="translate(41 24)">
    <path transform="scale(0)" fill="#fff4b8" d="M0 -4 L1 -1 L4 0 L1 1 L0 4 L-1 1 L-4 0 L-1 -1Z">
      <animateTransform attributeName="transform" type="scale" values="0;1;0" dur="1.9s" begin="0.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="0;-90" dur="1.9s" begin="0.5s" repeatCount="indefinite" additive="sum"/>
    </path>
  </g>
  <g transform="translate(35 6)">
    <path transform="scale(0)" fill="#ffc14d" d="M0 -3.5 L0.9 -0.9 L3.5 0 L0.9 0.9 L0 3.5 L-0.9 0.9 L-3.5 0 L-0.9 -0.9Z">
      <animateTransform attributeName="transform" type="scale" values="0;1;0" dur="1.4s" begin="1s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="0;90" dur="1.4s" begin="1s" repeatCount="indefinite" additive="sum"/>
    </path>
  </g>
</svg>
